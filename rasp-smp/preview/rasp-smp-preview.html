<title>RASP SMP</title>
<style>
:root{color-scheme:dark}
:root{
  --bg:#0b110e;--bg2:#111a15;--card:#152019;--line:#233329;--text:#e6f1ea;--muted:#8fa699;
  --accent:#34d399;--accent2:#fbbf24;--danger:#f87171;--info:#60a5fa;--radius:10px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;color:var(--text);background:var(--bg);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:48px 48px;background-position:-1px -1px;
  min-height:100vh;display:flex;flex-direction:column;
}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,transparent 0,var(--bg) 75%);pointer-events:none;z-index:-1}
.wrap{width:min(1120px,100% - 32px);margin-inline:auto}
main{flex:1;padding:32px 0 56px}
a{color:var(--accent)}
h1,h2,h3{line-height:1.2;margin:0 0 .5em}
h1{font-size:clamp(2rem,5vw,3.2rem);font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;letter-spacing:-.02em}
h2{font-size:1.5rem}
h3{font-size:1.1rem}
p{margin:0 0 1em}
.muted{color:var(--muted)}
.small{font-size:.875rem}

/* Nav */
.nav{position:sticky;top:0;z-index:20;background:rgba(11,17,14,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;gap:16px;min-height:60px}
.logo{display:flex;align-items:center;gap:10px;font:700 1.15rem ui-monospace,Menlo,Consolas,monospace;color:var(--text);text-decoration:none;letter-spacing:.04em}
.logo-block{width:22px;height:22px;background:var(--accent);box-shadow:inset -4px -4px 0 rgba(0,0,0,.28),inset 4px 4px 0 rgba(255,255,255,.22)}
.links{margin-left:auto;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.links a,.links button{color:var(--muted);text-decoration:none;padding:8px 12px;border-radius:8px;font:inherit;font-size:.95rem;background:none;border:0;cursor:pointer}
.links a:hover,.links button:hover{color:var(--text);background:var(--card)}
.links a.on{color:var(--accent);background:var(--card)}
.links .sep{width:1px;height:22px;background:var(--line);margin:0 6px}
.burger{display:none;margin-left:auto;background:none;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 12px;font-size:1.1rem;cursor:pointer}
@media(max-width:820px){
  .burger{display:block}
  .links{display:none;position:absolute;top:60px;left:0;right:0;background:var(--bg2);border-bottom:1px solid var(--line);padding:12px 16px;flex-direction:column;align-items:stretch}
  .links.open{display:flex}
  .links .sep{display:none}
}

/* Ortak bileşenler */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack>*+*{margin-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:.95rem;font-family:inherit;padding:10px 18px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#04130c;cursor:pointer;text-decoration:none;transition:filter .15s,transform .05s}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn.warn{background:var(--accent2);border-color:var(--accent2);color:#1b1300}
.btn.sm{padding:6px 12px;font-size:.85rem}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
label{display:block;font-size:.875rem;color:var(--muted);margin-bottom:6px}
input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px 12px;font:inherit}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
textarea{min-height:100px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
.field{margin-bottom:14px}
.check{display:flex;align-items:center;gap:8px;color:var(--text);font-size:.92rem;margin:0}
.badge{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.badge.green{color:var(--accent);border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.08)}
.badge.yellow{color:var(--accent2);border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.08)}
.badge.red{color:var(--danger);border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.08)}
.badge.blue{color:var(--info);border-color:rgba(96,165,250,.4);background:rgba(96,165,250,.08)}
.alert{padding:12px 16px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);margin-bottom:16px}
.alert.err{border-color:var(--danger);color:var(--danger)}
.alert.ok{border-color:var(--accent);color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:32px 12px}
hr{border:0;border-top:1px solid var(--line);margin:20px 0}
.pre{white-space:pre-wrap;word-break:break-word}

/* Ana sayfa */
.hero{padding:40px 0 28px;text-align:center}
.hero p.lead{font-size:1.15rem;color:var(--muted);max-width:620px;margin:0 auto 24px}
.ipbox{display:inline-flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 18px;font-family:ui-monospace,Menlo,Consolas,monospace}
.ipbox b{color:var(--accent);font-size:1.1rem}
.status{display:inline-flex;align-items:center;gap:8px;margin-top:16px;color:var(--muted);font-size:.92rem}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--accent);box-shadow:0 0 10px var(--accent)}
.dot.off{background:var(--danger)}
.feature .ico{width:36px;height:36px;display:grid;place-items:center;background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.35);border-radius:8px;margin-bottom:12px;font-size:1.1rem}
.section{margin-top:44px}
.section>h2{display:flex;align-items:center;gap:10px}
.section>h2::before{content:"";width:10px;height:10px;background:var(--accent)}
ol.rules{padding-left:20px;margin:0}
ol.rules li{margin-bottom:6px}

/* Mağaza */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tab{background:var(--card);border:1px solid var(--line);color:var(--muted);padding:7px 16px;border-radius:99px;cursor:pointer;font:inherit;font-size:.9rem;text-decoration:none}
.tab.on,.tab:hover{color:var(--accent);border-color:var(--accent)}
.product{display:flex;flex-direction:column;gap:10px}
.product .price{font:700 1.5rem ui-monospace,Menlo,monospace;color:var(--accent2)}
.product .desc{color:var(--muted);flex:1;margin:0}
.product form{display:none;border-top:1px solid var(--line);padding-top:12px}
.product.buying form{display:block}

/* Tablolar */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;background:var(--bg2)}
tr:last-child td{border-bottom:0}

/* Destek sohbeti */
.msgs{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
.msg{max-width:85%;padding:12px 16px;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.msg.staff{align-self:flex-end;background:rgba(52,211,153,.08);border-color:rgba(52,211,153,.35)}
.msg .who{font-size:.8rem;color:var(--muted);margin-bottom:4px}

/* Panel */
.panel{display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:start}
.side{position:sticky;top:76px;display:flex;flex-direction:column;gap:4px}
.side a{display:flex;justify-content:space-between;color:var(--muted);text-decoration:none;padding:9px 12px;border-radius:8px;font-size:.95rem}
.side a:hover{background:var(--card);color:var(--text)}
.side a.on{background:var(--card);color:var(--accent)}
@media(max-width:820px){.panel{grid-template-columns:1fr}.side{position:static;flex-direction:row;flex-wrap:wrap}}
.stat{padding:16px}
.stat .n{font:700 1.9rem ui-monospace,Menlo,monospace;color:var(--accent)}
.stat .l{color:var(--muted);font-size:.85rem}
.perm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px 16px;margin:12px 0}
.qa{border-left:2px solid var(--line);padding-left:12px;margin:10px 0}
.qa .q{color:var(--muted);font-size:.85rem}

/* Sahip düzenleme modu */
.h1s{font-size:2rem}
body.owner [data-edit]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.owner [data-edit] input,body.owner [data-edit] textarea{-webkit-user-select:text;user-select:text}
@media(hover:hover){body.owner [data-edit]:hover{outline:1px dashed rgba(251,191,36,.75);outline-offset:3px}}
.adjust-pop{position:fixed;z-index:60}
.adjust-pop button{background:var(--accent2);color:#1b1300;border:0;border-radius:8px;padding:10px 16px;font:600 .95rem system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.55);cursor:pointer}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:70;display:grid;place-items:center;padding:16px;overflow:auto}
.modal{width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}

.foot{border-top:1px solid var(--line);padding:20px 0;color:var(--muted);font-size:.85rem;background:var(--bg)}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--card);border:1px solid var(--accent);color:var(--text);padding:10px 20px;border-radius:10px;transition:.25s;z-index:50;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{border-color:var(--danger)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* Ödeme bilgileri */
.payrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.payrow:last-of-type{border-bottom:0}
.payval{font:600 1rem ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85em;background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.modal.wide{width:min(680px,100%)}

.preview-bar{background:#241c05;border-bottom:1px solid #6b5412;color:#fbbf24;font-size:.82rem;text-align:center;padding:6px 16px}
</style>
<div class="preview-bar">Önizleme: veriler sadece bu tarayıcıda tutulur. İlk kayıt olan hesap Sahip olur ve yönetim panelini görür.</div>
<header class="nav">
  <div class="wrap nav-in">
    <a class="logo" href="#/"><span class="logo-block"></span><span id="logoText">RASP SMP</span></a>
    <button class="burger" id="burger" aria-label="Menü">☰</button>
    <nav id="nav" class="links"></nav>
  </div>
</header>
<main id="app" class="wrap"></main>
<footer class="foot"><div class="wrap">© <span id="year"></span> <span id="footName">RASP SMP</span> · Mojang AB ile bağlantılı değildir.</div></footer>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>'use strict';
/* ÖNİZLEME MODU: Gerçek sunucu yerine API'yi tarayıcıda taklit eder.
   Veriler yalnızca bu tarayıcıda tutulur. Gerçek site için server.js kullanılır. */
(function () {
  const PERMS = {
    users: 'Kullanıcıları ve yetkileri yönet', products: 'Mağaza ürünlerini yönet', orders: 'Siparişleri yönet',
    tickets: 'Destek taleplerine bak ve yanıtla', forms: 'Başvuru formu oluştur / düzenle', applications: 'Başvuruları değerlendir',
    announcements: 'Duyuru yönet', settings: 'Site ayarlarını değiştir',
  };
  const KEY = 'rasp-preview-db';
  const uid = () => Math.random().toString(16).slice(2, 10) + Math.random().toString(16).slice(2, 10);
  const now = () => new Date().toISOString();
  const defaults = () => ({
    session: null, users: [],
    products: [
      { id: uid(), name: 'VIP Rütbe', category: 'Rütbeler', price: 99, description: 'Özel prefix, /fly ve ek home hakkı.', active: true },
      { id: uid(), name: 'MVP Rütbe', category: 'Rütbeler', price: 199, description: 'VIP avantajları + özel kit ve ek claim bloğu.', active: true },
      { id: uid(), name: '5000 Oyun Parası', category: 'Para', price: 49, description: 'Sunucu içi ekonomi için 5000 para.', active: true },
    ],
    orders: [], tickets: [], applications: [],
    forms: [{
      id: uid(), title: 'Yetkili Başvurusu', open: true, createdBy: 'sistem', createdAt: now(),
      description: 'Ekibimize katılmak istiyorsan formu eksiksiz doldur.',
      questions: [{ text: 'Yaşın kaç?', type: 'short' }, { text: 'Daha önce hangi sunucularda yetkili oldun?', type: 'long' }, { text: 'Neden seni seçmeliyiz?', type: 'long' }],
    }],
    announcements: [{ id: uid(), title: 'RASP SMP açıldı!', text: 'Sunucumuza hoş geldin. Kayıt ol, mağazaya göz at ve ekibimize başvur.', createdAt: now() }],
    settings: {
      name: 'RASP SMP', tagline: 'Arkadaşlarınla birlikte yaşa, inşa et, hayatta kal.', ip: 'play.raspsmp.com', version: '1.21+', discord: '',
      about: 'RASP SMP; adil kurallar, aktif yetkili ekibi ve topluluk odaklı bir survival sunucusudur.',
      rules: 'Hile ve bug kullanımı yasaktır.\nDiğer oyunculara küfür ve hakaret yasaktır.\nGrief ve çalmak yasaktır.\nYetkililerin kararlarına saygı göster.',
      paymentNote: 'Sipariş verdikten sonra kartla veya havale/EFT ile ödeyebilirsin. Ödeme onaylanınca ürün hesabına tanımlanır.',
      iban: 'TR19 0001 0090 1078 2727 1050 01', ibanName: '',
    },
  });
  let db;
  try { db = JSON.parse(localStorage.getItem(KEY)); } catch { db = null; }
  if (!db || !db.users) db = defaults();
  db.settings = { ...defaults().settings, ...db.settings };
  if (!db.settings.texts) db.settings.texts = {};
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch { /* bellekte kalır */ } };

  class E extends Error { constructor(s, m) { super(m); this.status = s; } }
  const bad = (m) => new E(400, m);
  const str = (v, max, name = 'Alan', o = {}) => {
    const s = typeof v === 'string' ? v.trim() : '';
    if (o.required && !s) throw bad(`${name} boş bırakılamaz.`);
    if (s.length > max) throw bad(`${name} en fazla ${max} karakter olabilir.`);
    return s;
  };
  const can = (u, p) => !!u && (u.role === 'owner' || u.permissions.includes(p));
  const isStaff = (u) => !!u && (u.role === 'owner' || u.permissions.length > 0);
  const pub = (u) => ({ id: u.id, username: u.username, mcname: u.mcname, role: u.role, title: u.title || '', permissions: u.role === 'owner' ? Object.keys(PERMS) : u.permissions, banned: !!u.banned, createdAt: u.createdAt });
  const canManage = (a, t) => t.role !== 'owner' && t.id !== a.id && (a.role === 'owner' || t.permissions.every((p) => a.permissions.includes(p)));
  const cleanIban = (v) => {
    const x = (typeof v === 'string' ? v : '').replace(/\s+/g, '').toUpperCase();
    if (!x) return '';
    if (!/^[A-Z]{2}\d{2}[A-Z0-9]{11,30}$/.test(x)) throw bad('IBAN biçimi geçersiz.');
    const d = (x.slice(4) + x.slice(0, 4)).replace(/[A-Z]/g, (c) => c.charCodeAt(0) - 55);
    let m = 0; for (const ch of d) m = (m * 10 + Number(ch)) % 97;
    if (m !== 1) throw bad('IBAN doğrulanamadı, tekrar kontrol et.');
    return x.replace(/(.{4})/g, '$1 ').trim();
  };
  const enc = (p) => 'x' + btoa(unescape(encodeURIComponent(p)));

  const R = [];
  const route = (m, p, o, h) => { const k = []; const re = new RegExp('^' + p.replace(/:(\w+)/g, (_, n) => { k.push(n); return '([^/]+)'; }) + '$'); R.push({ m, re, k, o, h }); };

  route('GET', '/api/public', {}, () => ({ settings: { ...db.settings, cardEnabled: true }, announcements: [...db.announcements].sort((a, b) => b.createdAt.localeCompare(a.createdAt)).slice(0, 5), openForms: db.forms.filter((f) => f.open).length }));
  route('GET', '/api/me', {}, (c) => ({ user: c.user ? pub(c.user) : null, allPermissions: PERMS }));
  route('POST', '/api/register', {}, (c) => {
    const username = str(c.body.username, 20, 'Kullanıcı adı', { required: true });
    const mcname = str(c.body.mcname, 16, 'Minecraft adı', { required: true });
    const pw = c.body.password || '';
    if (!/^[A-Za-z0-9_]{3,20}$/.test(username)) throw bad('Kullanıcı adı 3-20 karakter olmalı; harf, rakam ve _ kullanılabilir.');
    if (!/^[A-Za-z0-9_]{3,16}$/.test(mcname)) throw bad('Minecraft adı 3-16 karakter olmalı; harf, rakam ve _ kullanılabilir.');
    if (pw.length < 8) throw bad('Şifre en az 8 karakter olmalı.');
    if (db.users.some((u) => u.username.toLowerCase() === username.toLowerCase())) throw bad('Bu kullanıcı adı zaten alınmış.');
    const first = db.users.length === 0;
    const u = { id: uid(), username, mcname, pw: enc(pw), role: first ? 'owner' : 'member', permissions: [], title: first ? 'Kurucu' : '', banned: false, createdAt: now() };
    db.users.push(u); db.session = u.id; save();
    return { user: pub(u), firstUser: first };
  });
  route('POST', '/api/login', {}, (c) => {
    const u = db.users.find((x) => x.username.toLowerCase() === String(c.body.username || '').toLowerCase());
    if (!u || u.pw !== enc(c.body.password || '')) throw new E(401, 'Kullanıcı adı veya şifre hatalı.');
    if (u.banned) throw new E(403, 'Hesabın engellenmiş.');
    db.session = u.id; save(); return { user: pub(u) };
  });
  route('POST', '/api/logout', {}, () => { db.session = null; save(); return { ok: true }; });
  route('POST', '/api/me/password', { auth: true }, (c) => {
    if (enc(c.body.current || '') !== c.user.pw) throw bad('Mevcut şifre hatalı.');
    if ((c.body.next || '').length < 8) throw bad('Yeni şifre en az 8 karakter olmalı.');
    c.user.pw = enc(c.body.next); save(); return { ok: true };
  });

  route('GET', '/api/products', {}, (c) => db.products.filter((p) => (c.q.get('all') === '1' && can(c.user, 'products')) || p.active));
  const pf = (b) => {
    const price = Number(b.price);
    if (!Number.isFinite(price) || price < 0) throw bad('Fiyat geçersiz.');
    return { name: str(b.name, 60, 'Ürün adı', { required: true }), category: str(b.category, 30, 'Kategori') || 'Diğer', description: str(b.description, 400, 'Açıklama'), price, active: b.active !== false };
  };
  route('POST', '/api/products', { perm: 'products' }, (c) => { const p = { id: uid(), ...pf(c.body) }; db.products.push(p); save(); return p; });
  route('PUT', '/api/products/:id', { perm: 'products' }, (c) => { const p = db.products.find((x) => x.id === c.p.id); if (!p) throw new E(404, 'Ürün bulunamadı.'); Object.assign(p, pf(c.body)); save(); return p; });
  route('DELETE', '/api/products/:id', { perm: 'products' }, (c) => { db.products = db.products.filter((x) => x.id !== c.p.id); save(); return { ok: true }; });

  route('POST', '/api/orders', { auth: true }, (c) => {
    const p = db.products.find((x) => x.id === c.body.productId && x.active);
    if (!p) throw new E(404, 'Ürün bulunamadı.');
    const mcname = str(c.body.mcname || c.user.mcname, 16, 'Minecraft adı', { required: true });
    const oid = uid(); const o = { id: oid, code: 'RASP-' + oid.slice(0, 6).toUpperCase(), userId: c.user.id, username: c.user.username, mcname, productId: p.id, productName: p.name, price: p.price, status: 'pending', createdAt: now() };
    db.orders.push(o); save(); return o;
  });
  route('GET', '/api/orders', { auth: true }, (c) => db.orders.filter((o) => (c.q.get('all') === '1' && can(c.user, 'orders')) || o.userId === c.user.id).sort((a, b) => b.createdAt.localeCompare(a.createdAt)));
  route('POST', '/api/orders/:id/pay', { auth: true }, (c) => {
    const o = db.orders.find((x) => x.id === c.p.id && x.userId === c.user.id);
    if (!o) throw new E(404, 'Sipariş bulunamadı.');
    if (!/^[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}$/.test(c.body.email || '')) throw bad('Geçerli bir e-posta yaz (Türkçe karakter olmadan).');
    if (String(c.body.phone || '').replace(/[^\d+]/g, '').length < 10) throw bad('Telefon numarası geçersiz.');
    return { demo: true };
  });
  route('POST', '/api/orders/:id/demo-pay', { auth: true }, (c) => {
    const o = db.orders.find((x) => x.id === c.p.id && x.userId === c.user.id);

  const paytrDemo = (req) => ({ configured: true, fromEnv: false, merchantId: 'DEMO', hasKey: true, hasSalt: true, testMode: true, lastError: null, callbackUrl: 'https://siteniz.com/api/paytr/callback' });
  route('GET', '/api/admin/paytr', { perm: 'settings' }, (c) => { if (c.user.role !== 'owner') throw new E(403, 'Bu ayarı sadece sahip değiştirebilir.'); return paytrDemo(); });
  route('PUT', '/api/admin/paytr', { perm: 'settings' }, (c) => { if (c.user.role !== 'owner') throw new E(403, 'Bu ayarı sadece sahip değiştirebilir.'); return paytrDemo(); });
  route('POST', '/api/orders/:id/status', { perm: 'orders' }, (c) => { const o = db.orders.find((x) => x.id === c.p.id); if (!o) throw new E(404, 'Sipariş bulunamadı.'); o.status = c.body.status; save(); return o; });

  const tv = (t) => ({ ...t, messages: undefined, messageCount: t.messages.length });

  const ff = (b) => {

  };
  route('GET', '/api/forms', {}, (c) => db.forms.filter((f) => (c.q.get('all') === '1' && can(c.user, 'forms')) || f.open));
  route('POST', '/api/forms', { perm: 'forms' }, (c) => { const f = { id: uid(), ...ff(c.body), createdBy: c.user.username, createdAt: now() }; db.forms.push(f); save(); return f; });
  route('PUT', '/api/forms/:id', { perm: 'forms' }, (c) => { const f = db.forms.find((x) => x.id === c.p.id); if (!f) throw new E(404, 'Form bulunamadı.'); Object.assign(f, ff(c.body)); save(); return f; });
  route('DELETE', '/api/forms/:id', { perm: 'forms' }, (c) => { db.forms = db.forms.filter((x) => x.id !== c.p.id); save(); return { ok: true }; });

  route('POST', '/api/applications', { auth: true }, (c) => {
    const f = db.forms.find((x) => x.id === c.body.formId && x.open);
    if (!f) throw new E(404, 'Bu başvuru şu an açık değil.');
    if (db.applications.some((a) => a.userId === c.user.id && a.formId === f.id && a.status === 'pending')) throw bad('Bu form için zaten bekleyen bir başvurun var.');
    const ans = c.body.answers || [];
    const a = { id: uid(), formId: f.id, formTitle: f.title, userId: c.user.id, username: c.user.username, mcname: c.user.mcname, answers: f.questions.map((q, i) => ({ q: q.text, a: str(ans[i], 2000, 'Cevap', { required: true }) })), status: 'pending', note: '', createdAt: now() };
    db.applications.push(a); save(); return a;
  });
  route('GET', '/api/applications', { auth: true }, (c) => db.applications.filter((a) => (c.q.get('all') === '1' && can(c.user, 'applications')) || a.userId === c.user.id).sort((a, b) => b.createdAt.localeCompare(a.createdAt)));
  route('POST', '/api/applications/:id/review', { perm: 'applications' }, (c) => {
    const a = db.applications.find((x) => x.id === c.p.id); if (!a) throw new E(404, 'Başvuru bulunamadı.');
    a.status = c.body.status; a.note = str(c.body.note, 500, 'Not'); a.reviewedBy = c.user.username; a.reviewedAt = now(); save(); return a;
  });

  route('GET', '/api/admin/stats', { staff: true }, () => ({
    users: db.users.length, staff: db.users.filter(isStaff).length, openTickets: db.tickets.filter((t) => t.status !== 'closed').length,
    pendingApps: db.applications.filter((a) => a.status === 'pending').length, pendingOrders: db.orders.filter((o) => o.status === 'pending' || o.status === 'paid').length,

  }));
  route('GET', '/api/admin/users', { perm: 'users' }, (c) => db.users.map((u) => ({ ...pub(u), manageable: canManage(c.user, u) })));
  route('POST', '/api/admin/users/:id/access', { perm: 'users' }, (c) => {
    const t = db.users.find((u) => u.id === c.p.id); if (!t) throw new E(404, 'Kullanıcı bulunamadı.');

  });
  route('POST', '/api/admin/users/:id/ban', { perm: 'users' }, (c) => {
    const t = db.users.find((u) => u.id === c.p.id); if (!t) throw new E(404, 'Kullanıcı bulunamadı.');

    t.banned = !!c.body.banned; if (t.banned && db.session === t.id) db.session = null; save(); return pub(t);
  });
  route('POST', '/api/admin/users/:id/password', { perm: 'users' }, (c) => {
    const t = db.users.find((u) => u.id === c.p.id); if (!t) throw new E(404, 'Kullanıcı bulunamadı.');
    if (!canManage(c.user, t)) throw new E(403, 'Bu kullanıcının şifresini değiştiremezsin.');
    if ((c.body.password || '').length < 8) throw bad('Şifre en az 8 karakter olmalı.');
    t.pw = enc(c.body.password); save(); return { ok: true };
  });
  route('POST', '/api/announcements', { perm: 'announcements' }, (c) => { const a = { id: uid(), title: str(c.body.title, 100, 'Başlık', { required: true }), text: str(c.body.text, 1000, 'Metin', { required: true }), createdAt: now() }; db.announcements.push(a); save(); return a; });
  route('DELETE', '/api/announcements/:id', { perm: 'announcements' }, (c) => { db.announcements = db.announcements.filter((x) => x.id !== c.p.id); save(); return { ok: true }; });
  route('PUT', '/api/texts', { perm: 'settings' }, (c) => {
    const key = typeof c.body.key === 'string' ? c.body.key : '';
    if (!/^[a-z][a-z0-9_]{0,39}$/.test(key)) throw bad('Geçersiz yazı anahtarı.');
    const value = str(c.body.value, 1000, 'Yazı');
    db.settings = { ...defaults().settings, ...db.settings };
  if (!db.settings.texts) db.settings.texts = {};
    if (value) db.settings.texts[key] = value; else delete db.settings.texts[key];
    save(); return db.settings;
  });
  route('PUT', '/api/announcements/:id', { perm: 'announcements' }, (c) => {
    const a = db.announcements.find((x) => x.id === c.p.id); if (!a) throw new E(404, 'Duyuru bulunamadı.');
    a.title = str(c.body.title, 100, 'Başlık', { required: true }); a.text = str(c.body.text, 1000, 'Metin', { required: true }); save(); return a;
  });
  route('PUT', '/api/settings', { perm: 'settings' }, (c) => {
    const b = c.body, s = db.settings;
    s.name = str(b.name, 40, 'Sunucu adı', { required: true }); s.tagline = str(b.tagline, 140); s.ip = str(b.ip, 80); s.version = str(b.version, 30);
    s.discord = str(b.discord, 200); if (s.discord && !/^https?:\/\//i.test(s.discord)) throw bad('Discord linki http:// veya https:// ile başlamalı.');
    s.about = str(b.about, 800); s.rules = str(b.rules, 3000); s.paymentNote = str(b.paymentNote, 600); s.iban = cleanIban(b.iban); s.ibanName = str(b.ibanName, 80, 'Alıcı adı'); save(); return s;

  const realFetch = window.fetch.bind(window);
  window.fetch = async (url, opts = {}) => {
    if (typeof url !== 'string' || !url.startsWith('/api/')) return realFetch(url, opts);
    const u = new URL(url, 'http://x');
    const method = (opts.method || 'GET').toUpperCase();
    const r = R.find((x) => x.m === method && x.re.test(u.pathname));
    const reply = (s, o) => new Response(JSON.stringify(o), { status: s, headers: { 'Content-Type': 'application/json' } });
    try {
      if (!r) throw new E(404, 'Bulunamadı.');
      const user = db.users.find((x) => x.id === db.session && !x.banned) || null;
      if ((r.o.auth || r.o.perm || r.o.staff) && !user) throw new E(401, 'Giriş yapmalısın.');
      if (r.o.perm && !can(user, r.o.perm)) throw new E(403, 'Bu işlem için yetkin yok.');
      if (r.o.staff && !isStaff(user)) throw new E(403, 'Bu işlem için yetkin yok.');
      const m = u.pathname.match(r.re); const p = {}; r.k.forEach((k, i) => { p[k] = m[i + 1]; });
      const body = opts.body ? JSON.parse(opts.body) : {};
      return reply(200, await r.h({ user, p, body, q: u.searchParams }));
    } catch (e) {
      if (e instanceof E) return reply(e.status, { error: e.message });
      console.error(e); return reply(500, { error: 'Sunucu hatası.' });
    }
  };

  /* Önizleme çerçevesi confirm()/prompt() göstermez; panel işlemleri için yerine koyuyoruz. */
  window.confirm = () => true;
  window.prompt = () => 'yenisifre123';
})();

<script>'use strict';
/* RASP SMP - ön yüz (tek sayfa uygulaması, hash yönlendirme) */

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = (s) => new Date(s).toLocaleString('tr-TR', { dateStyle: 'medium', timeStyle: 'short' });
const money = (n) => Number(n).toLocaleString('tr-TR', { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + ' ₺';

const state = { user: null, perms: {}, pub: { settings: {}, announcements: [] } };
const hasPerm = (p) => !!state.user && state.user.permissions.includes(p);
const isStaff = () => !!state.user && state.user.permissions.length > 0;

async function api(url, method = 'GET', body) {
  const r = await fetch('/api' + url, {
    method, credentials: 'same-origin',
    headers: body ? { 'Content-Type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  let d = {};
  try { d = await r.json(); } catch { /* boş */ }
  if (!r.ok) throw new Error(d.error || 'Bir hata oluştu.');
  return d;
}

let toastTimer;
function toast(msg, err = false) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = 'toast'; }, 3200);
}
const guard = async (fn) => { try { await fn(); } catch (e) { toast(e.message, true); } };

const STATUS = {
  pending: ['Beklemede', 'yellow'], paid: ['Ödendi · teslim bekliyor', 'blue'], delivered: ['Teslim edildi', 'green'], cancelled: ['İptal', 'red'],
  accepted: ['Kabul edildi', 'green'], rejected: ['Reddedildi', 'red'],
  open: ['Açık', 'yellow'], answered: ['Yanıtlandı', 'blue'], closed: ['Kapalı', 'red'],
};
const badge = (s) => `<span class="badge ${STATUS[s][1]}">${STATUS[s][0]}</span>`;

/* Sahip, sitedeki yazıları basılı tutarak "Ayarla" ile değiştirebilir.
   t:<anahtar> = serbest yazı, s:<alan> = site ayarı, p:<id> = ürün, a:<id> = duyuru */
const tx = (k, d) => { const v = state.pub.settings.texts && state.pub.settings.texts[k]; return esc(v !== undefined ? v : d); };
const ed = (k, d, tag = 'span', cls = '') => `<${tag} data-edit="t:${k}" data-def="${esc(d)}"${cls ? ` class="${cls}"` : ''}>${tx(k, d)}</${tag}>`;
const oc = (o) => o.code || 'RASP-' + String(o.id).slice(0, 6).toUpperCase();
const ibanRaw = (v) => String(v || '').replace(/\s+/g, '');
function payRows(S, o) {
  const row = (label, val, copy, edit) => `<div class="payrow"><div><div class="muted small">${label}</div><div class="payval"${edit ? ` data-edit="${edit}"` : ''}>${val}</div></div>${copy ? `<button type="button" class="btn sm ghost" data-act="copy" data-v="${esc(copy)}">Kopyala</button>` : ''}</div>`;
  let h = row('IBAN', esc(S.iban), ibanRaw(S.iban), 's:iban');
  if (S.ibanName) h += row('Alıcı', esc(S.ibanName), S.ibanName, 's:ibanName');
  else if (!o && hasPerm('settings')) h += row('Alıcı', '<span class="muted">Alıcı adı girilmemiş. Basılı tutup ekle.</span>', '', 's:ibanName');
  if (o) h += row('Tutar', money(o.price), String(o.price)) + row('Açıklama (zorunlu)', esc(oc(o)), oc(o));
  return h;
}
let payPoll = null;
const stopPoll = () => { if (payPoll) { clearInterval(payPoll); payPoll = null; } };
function showPayment(o) {
  const S = state.pub.settings;
  closeModal();
  const m = document.createElement('div');
  m.id = 'modal'; m.className = 'modal-back';
  m.innerHTML = '<div class="modal card" role="dialog" aria-modal="true" aria-label="Ödeme"><div id="payBody"></div></div>';
  document.body.appendChild(m);
  const box = $('.modal', m), body = $('#payBody', m);
  const summary = `<p class="muted">${esc(o.productName)} · <b style="color:var(--text)">${money(o.price)}</b> · ${esc(o.mcname)} · <code>${esc(oc(o))}</code></p>`;
  const closeBtn = '<div class="row" style="margin-top:16px"><button type="button" class="btn ghost" data-m="close">Kapat</button></div>';
  const backBtn = (both) => both ? '<button type="button" class="btn ghost" data-m="home">← Geri</button>' : '';
  const both = !!(S.cardEnabled && S.iban);

  const bank = () => {
    box.classList.remove('wide');
    body.innerHTML = `<h3>Havale / EFT ile öde</h3>${summary}
      <p>Açıklama kısmına <b>sipariş kodunu</b> yaz, yoksa ödemeni eşleştiremeyiz.</p>${payRows(S, o)}
      <p class="muted small">Ödeme kontrol edilince ürün hesabına tanımlanır. Siparişini "Siparişlerim" bölümünden takip edebilirsin.</p>
      <div class="row" style="margin-top:16px">${backBtn(both)}<button type="button" class="btn" data-m="close">Tamam</button></div>`;
  };
  const watch = () => {
    stopPoll();
    payPoll = setInterval(async () => {
      try {
        const cur = (await api('/orders')).find((x) => x.id === o.id);
        if (cur && (cur.status === 'paid' || cur.status === 'delivered')) { closeModal(); toast('Ödemen alındı! Ürün kısa süre içinde teslim edilecek.'); render(true); }
      } catch { /* sonraki turda tekrar dener */ }
    }, 4000);
  };
  const card = () => {
    box.classList.remove('wide');
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem('rasp-pay-contact') || '{}'); } catch { /* yoksay */ }
    body.innerHTML = `<h3>Kartla öde</h3>${summary}
      <p class="muted small">PayTR sana ödeme için e-posta ve telefon soruyor. Kart bilgilerini bir sonraki adımda PayTR'ın güvenli sayfasına girersin, bu sitede saklanmaz.</p>
      <form id="payForm"><div class="field"><label for="pe">E-posta</label><input id="pe" name="email" type="email" required maxlength="100" value="${esc(saved.email || '')}" autocomplete="email"></div>
      <div class="field"><label for="pp">Telefon</label><input id="pp" name="phone" type="tel" required maxlength="20" placeholder="05xx xxx xx xx" value="${esc(saved.phone || '')}" autocomplete="tel"></div>
      <div class="row"><button class="btn">Ödemeye Geç</button>${backBtn(both)}<button type="button" class="btn ghost" data-m="close">Vazgeç</button></div></form>`;
    $('#payForm', m).addEventListener('submit', (e) => {
      e.preventDefault();
      const d = formData(e.target);
      const btn = $('button', e.target); btn.disabled = true;
      guard(async () => {
        try { localStorage.setItem('rasp-pay-contact', JSON.stringify(d)); } catch { /* yoksay */ }
        const r = await api(`/orders/${o.id}/pay`, 'POST', d);
        if (r.demo) demo(); else frame(r.token);
      }).finally(() => { btn.disabled = false; });
    });
  };
  const frame = (token) => {
    box.classList.add('wide');
    body.innerHTML = `<h3>Kartla öde</h3>${summary}
      <iframe id="paytriframe" title="PayTR güvenli ödeme" src="https://www.paytr.com/odeme/guvenli/${encodeURIComponent(token)}" style="width:100%;border:0;min-height:520px" scrolling="no"></iframe>
      <p class="muted small">Ödeme tamamlanınca bu pencere kendiliğinden kapanır.</p>${closeBtn}`;
    const sc = document.createElement('script');
    sc.src = 'https://www.paytr.com/js/iframeResizer.min.js';
    sc.onload = () => { if (window.iFrameResize) window.iFrameResize({}, '#paytriframe'); };
    document.head.appendChild(sc);
    watch();
  };
  const demo = () => {
    body.innerHTML = `<h3>Önizleme</h3>${summary}
      <div class="alert">Gerçek sitede burada PayTR'ın güvenli kart sayfası açılır. Önizlemede kart bilgisi alınmaz, aşağıdaki düğme ödemenin tamamlanmasını taklit eder.</div>
      <div class="row"><button type="button" class="btn" data-m="demoPaid">Ödemeyi başarılı say (demo)</button><button type="button" class="btn ghost" data-m="close">Vazgeç</button></div>`;
  };
  const home = () => {
    box.classList.remove('wide');
    body.innerHTML = `<h3>Sipariş alındı</h3>${summary}<p>Ödeme yöntemini seç:</p>
      <div class="row"><button type="button" class="btn" data-m="card">💳 Kartla öde</button><button type="button" class="btn ghost" data-m="bank">Havale / EFT</button></div>${closeBtn}`;
  };

  m.addEventListener('mousedown', (e) => { if (e.target === m) closeModal(); });
  m.addEventListener('click', (e) => {
    const b = e.target.closest('[data-m]');
    if (!b) return;
    const act = b.dataset.m;
    if (act === 'close') closeModal();
    else if (act === 'home') home();
    else if (act === 'card') card();
    else if (act === 'bank') bank();
    else if (act === 'demoPaid') guard(async () => { await api(`/orders/${o.id}/demo-pay`, 'POST'); closeModal(); toast('Ödeme alındı (demo).'); render(true); });
  });

  if (both) home();
  else if (S.cardEnabled) card();
  else if (S.iban) bank();
  else body.innerHTML = `<h3>Sipariş alındı</h3>${summary}<p>${esc(S.paymentNote)}</p>${closeBtn}`;
}
const es = (f, tag = 'span', cls = '') => `<${tag} data-edit="s:${f}"${cls ? ` class="${cls}"` : ''}>${esc(state.pub.settings[f])}</${tag}>`;

/* ------------------------------- Gezinme ------------------------------- */
function renderNav(route) {
  const s = state.pub.settings;
  $('#logoText').textContent = s.name || 'RASP SMP';
  $('#footName').textContent = s.name || 'RASP SMP';
  document.title = s.name || 'RASP SMP';
  document.body.classList.toggle('owner', state.user?.role === 'owner');
  const link = (href, label) => `<a href="#/${href}" class="${route === href.split('/')[0] ? 'on' : ''}">${label}</a>`;
  let h = link('', ed('nav_home', 'Ana Sayfa')) + link('store', ed('nav_store', 'Mağaza')) + link('support', ed('nav_support', 'Destek')) + link('apply', ed('nav_apply', 'Başvuru'));
  if (isStaff()) h += link('admin', 'Yönetim Paneli');
  h += '<span class="sep"></span>';

async function render(keepScroll = false) {
  const keepY = keepScroll === true ? window.scrollY : 0;
  const parts = location.hash.replace(/^#\/?/, '').split('/');
  const page = parts[0] || '';
  renderNav(page);
  const app = $('#app');
  const views = { '': home, store, support, apply, login, register, account, admin };
  const view = views[page];
  if (!keepScroll) window.scrollTo(0, 0);
  if (!view) { app.innerHTML = '<div class="empty"><h2>Sayfa bulunamadı</h2><a href="#/">Ana sayfaya dön</a></div>'; return; }
  try { if (!keepScroll) app.innerHTML = '<div class="empty">Yükleniyor…</div>'; await view(app, parts.slice(1)); }
  catch (e) { app.innerHTML = `<div class="alert err">${esc(e.message)}</div>`; }
  if (keepScroll) window.scrollTo(0, keepY);
}
window.addEventListener('hashchange', () => render());

async function checkStatus(ip) {
  const dot = $('#dot'), txt = $('#statusText');
  if (!ip) { txt.textContent = ''; return; }
  try {
    const r = await fetch('https://api.mcsrvstat.us/3/' + encodeURIComponent(ip));
    const d = await r.json();
    if (!dot) return;
    if (d.online) { dot.className = 'dot on'; txt.textContent = `Çevrimiçi · ${d.players?.online ?? 0}/${d.players?.max ?? '?'} oyuncu`; }
    else { dot.className = 'dot off'; txt.textContent = 'Sunucu şu an kapalı'; }
  } catch { if (dot) { dot.className = 'dot'; txt.textContent = 'Sunucu durumu alınamadı'; } }
}

const formData = (f) => Object.fromEntries(new FormData(f).entries());

const submits = {
  async login(f) {
    const d = await api('/login', 'POST', formData(f));
    state.user = d.user; toast('Hoş geldin, ' + d.user.username + '!'); location.hash = '#/';
  },
  async register(f) {
    const d = await api('/register', 'POST', formData(f));
    state.user = d.user;
    toast(d.firstUser ? 'İlk hesap olduğun için SAHİP yetkisi verildi!' : 'Hesabın oluşturuldu!');
    location.hash = d.firstUser ? '#/admin' : '#/';
  },
  async password(f) { await api('/me/password', 'POST', formData(f)); f.reset(); toast('Şifren güncellendi.'); },
  async order(f) {
    const o = await api('/orders', 'POST', formData(f));
    await render(true);
    showPayment(o);
  },
  async ticket(f) { const d = await api('/tickets', 'POST', formData(f)); location.hash = '#/support/' + d.id; },
  async reply(f) { await api(`/tickets/${f.dataset.id}/reply`, 'POST', formData(f)); render(); },
  async application(f) {
    const d = formData(f);
    const answers = Object.keys(d).filter((k) => /^a\d+$/.test(k)).sort((a, b) => a.slice(1) - b.slice(1)).map((k) => d[k]);
    await api('/applications', 'POST', { formId: f.dataset.id, answers });
    toast('Başvurun gönderildi!'); location.hash = '#/apply';
  },
  async announcement(f) { await api('/announcements', 'POST', formData(f)); toast('Duyuru yayınlandı.'); render(); },
  async paytr(f) {
    const d = formData(f);
    await api('/admin/paytr', 'PUT', { merchantId: d.merchantId, merchantKey: d.merchantKey, merchantSalt: d.merchantSalt, testMode: f.testMode.checked });
    state.pub = await api('/public'); toast('Kaydedildi.'); adminTabs.payment($('#tabBody'));
  },
  async settings(f) {
    const s = await api('/settings', 'PUT', formData(f));
    state.pub.settings = s; renderNav('admin'); toast('Ayarlar kaydedildi.');
  },
};

/* ------------------------- Sahip düzenleme modu -------------------------
   Sahip bir yazıya / karta basılı tutar (bilgisayarda sağ tık), "Ayarla" çıkar. */
const EDIT_FIELDS = {
  name: ['Sunucu adı', false], tagline: ['Slogan', false], ip: ['Sunucu IP adresi', false],
  iban: ['IBAN (TR ile başlar)', false], ibanName: ['Alıcı adı soyadı', false], about: ['Hakkımızda', true], rules: ['Kurallar (her satıra bir kural)', true], paymentNote: ['Mağaza ödeme notu', true],
};
const isOwner = () => state.user?.role === 'owner';
let pop = null, holdTimer = null, holdStart = null, suppressClick = false;

function closePop() { if (pop) { pop.remove(); pop = null; } }
function openAdjust(el, x, y) {
  closePop();
  pop = document.createElement('div');
  pop.className = 'adjust-pop';
  pop.innerHTML = '<button type="button">✎ Ayarla</button>';
  document.body.appendChild(pop);
  const w = pop.offsetWidth || 110;
  pop.style.left = Math.max(8, Math.min(x - w / 2, window.innerWidth - w - 8)) + 'px';
  pop.style.top = Math.max(8, y - 56) + 'px';
  $('button', pop).onclick = () => { closePop(); guard(() => openEditor(el.dataset.edit, el)); };
  setTimeout(() => {
    document.addEventListener('pointerdown', function off(e) {
      document.removeEventListener('pointerdown', off);
      if (pop && !pop.contains(e.target)) closePop();
    });
  }, 0);
}

document.addEventListener('pointerdown', (e) => {
  if (!isOwner() || e.button > 0 || e.target.closest('#modal, .adjust-pop')) return;
  const el = e.target.closest('[data-edit]');
  if (!el) return;
  holdStart = { x: e.clientX, y: e.clientY };
  clearTimeout(holdTimer);
  holdTimer = setTimeout(() => { holdTimer = null; suppressClick = true; openAdjust(el, holdStart.x, holdStart.y); }, 550);
});
['pointerup', 'pointercancel'].forEach((t) => document.addEventListener(t, () => {
  clearTimeout(holdTimer);
  if (suppressClick) setTimeout(() => { suppressClick = false; }, 120);
}));
document.addEventListener('pointermove', (e) => {
  if (holdTimer && holdStart && Math.hypot(e.clientX - holdStart.x, e.clientY - holdStart.y) > 10) clearTimeout(holdTimer);
});
document.addEventListener('scroll', () => clearTimeout(holdTimer), true);
document.addEventListener('click', (e) => { if (suppressClick) { suppressClick = false; e.preventDefault(); e.stopPropagation(); } }, true);
document.addEventListener('contextmenu', (e) => {
  if (!isOwner()) return;
  const el = e.target.closest('[data-edit]');
  if (!el) return;
  e.preventDefault(); suppressClick = false;
  openAdjust(el, e.clientX, e.clientY);
});

function closeModal() { stopPoll(); $('#modal')?.remove(); }
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeModal(); closePop(); } });

async function openEditor(spec, el) {
  const type = spec.slice(0, 1), id = spec.slice(2);
  const S = state.pub.settings;
  let title, fields, onSave, onDelete, onReset;
  const input = (n, l, v, o = {}) => `<div class="field"><label for="e_${n}">${esc(l)}</label>${o.area
    ? `<textarea id="e_${n}" name="${n}" style="min-height:${o.h || 120}px" maxlength="${o.max || 1000}">${esc(v)}</textarea>`
    : `<input id="e_${n}" name="${n}" value="${esc(v)}" maxlength="${o.max || 200}" ${o.list ? `list="${o.list}"` : ''} ${o.type ? `type="${o.type}" step="0.01" min="0"` : ''}>`}</div>`;

  if (type === 't') {
    const cur = S.texts && S.texts[id] !== undefined ? S.texts[id] : (el.dataset.def || el.textContent);
    title = 'Yazıyı düzenle';
    fields = input('value', 'Yeni yazı', cur, { area: cur.length > 60, h: 100, max: 1000 });
    onSave = (d) => api('/texts', 'PUT', { key: id, value: d.value });
    onReset = () => api('/texts', 'PUT', { key: id, value: '' });
  } else if (type === 's') {
    const [label, area] = EDIT_FIELDS[id] || [id, false];
    title = label;
    fields = input('value', label, S[id] || '', { area, h: id === 'rules' ? 200 : 120, max: 3000 });
    onSave = (d) => { const { texts, ...rest } = S; return api('/settings', 'PUT', { ...rest, [id]: d.value }); };
  } else if (type === 'p') {
    const all = await api('/products?all=1');
    const isNew = id === 'new';
    const p = isNew ? { name: '', category: all[0]?.category || 'Rütbeler', price: '', description: '', active: true } : all.find((x) => x.id === id);
    if (!p) throw new Error('Ürün bulunamadı.');
    title = isNew ? 'Yeni ürün ekle' : 'Ürünü düzenle';
    const cats = [...new Set(all.map((x) => x.category))];
    fields = input('name', 'Ürün adı', p.name, { max: 60 }) + input('category', 'Kategori (yeni yazarak yeni kategori açarsın)', p.category, { max: 30, list: 'catlist' })
      + `<datalist id="catlist">${cats.map((c) => `<option value="${esc(c)}">`).join('')}</datalist>`
      + input('price', 'Fiyat (₺)', p.price, { type: 'number' }) + input('description', 'Açıklama', p.description, { area: true, h: 80, max: 400 })
      + `<label class="check" style="margin-bottom:14px"><input type="checkbox" name="active" ${p.active ? 'checked' : ''}> Mağazada göster</label>`;
    const body = (d, f) => ({ name: d.name, category: d.category, price: d.price, description: d.description, active: f.active.checked });
    onSave = (d, f) => (isNew ? api('/products', 'POST', body(d, f)) : api('/products/' + id, 'PUT', body(d, f)));
    if (!isNew) onDelete = () => api('/products/' + id, 'DELETE');
  } else if (type === 'a') {
    const isNew = id === 'new';
    const a = isNew ? { title: '', text: '' } : state.pub.announcements.find((x) => x.id === id);
    if (!a) throw new Error('Duyuru bulunamadı.');
    title = isNew ? 'Yeni duyuru' : 'Duyuruyu düzenle';
    fields = input('title', 'Başlık', a.title, { max: 100 }) + input('text', 'Metin', a.text, { area: true, h: 120 });
    onSave = (d) => (isNew ? api('/announcements', 'POST', { title: d.title, text: d.text }) : api('/announcements/' + id, 'PUT', { title: d.title, text: d.text }));
    if (!isNew) onDelete = () => api('/announcements/' + id, 'DELETE');
  } else return;

  closeModal();
  const m = document.createElement('div');
  m.id = 'modal'; m.className = 'modal-back';
  m.innerHTML = `<form class="modal card" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3>${fields}
    <div class="row"><button class="btn">Kaydet</button>
      ${onReset ? '<button type="button" class="btn ghost" data-m="reset">Varsayılana dön</button>' : ''}
      ${onDelete ? '<button type="button" class="btn danger" data-m="del">Sil</button>' : ''}
      <button type="button" class="btn ghost" data-m="cancel">İptal</button></div></form>`;
  document.body.appendChild(m);
  const form = $('form', m);
  const first = $('input:not([type=checkbox]), textarea', form);
  if (first) { first.focus(); if (first.select) first.select(); }
  const done = async (fn, msg) => {
    await fn();
    state.pub = await api('/public');
    closeModal(); toast(msg); render(true);
  };
  m.addEventListener('mousedown', (e) => { if (e.target === m) closeModal(); });
  form.addEventListener('submit', (e) => { e.preventDefault(); guard(() => done(() => onSave(formData(form), form), 'Kaydedildi.')); });
  form.addEventListener('click', (e) => {
    const b = e.target.closest('[data-m]');
    if (!b) return;
    if (b.dataset.m === 'cancel') closeModal();
    if (b.dataset.m === 'reset') guard(() => done(onReset, 'Varsayılana döndü.'));
    if (b.dataset.m === 'del' && confirm('Silinsin mi?')) guard(() => done(onDelete, 'Silindi.'));
  });
}

/* ------------------------------- Başlat ------------------------------- */
(async function init() {
  $('#year').textContent = new Date().getFullYear();
  try {
    const [me, pub] = await Promise.all([api('/me'), api('/public')]);
    state.user = me.user; state.perms = me.allPermissions; state.pub = pub;
  } catch (e) { toast(e.message, true); }
  await render();
  if (isOwner()) {
    let seen = false;
    try { seen = sessionStorage.getItem('rasp-owner-hint') === '1'; sessionStorage.setItem('rasp-owner-hint', '1'); } catch { /* yoksay */ }
    if (!seen) toast('Sahip modu: bir yazıya veya karta basılı tut, "Ayarla" çıksın.');
  }
})();
</script>
